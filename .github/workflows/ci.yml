name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Rust: lint + unit tests. No Godot needed. The always-on Phase 0 gate.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (check / clippy / test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --manifest-path rust/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings

      - name: cargo test (pure core)
        run: cargo test -p tictactoe-core --manifest-path rust/Cargo.toml

  # ---------------------------------------------------------------------------
  # Godot headless smoke test. Comes online in Phase 2 once a main scene exists.
  # ---------------------------------------------------------------------------
